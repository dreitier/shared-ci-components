name: Trivy image scan
description: >-
  Scans a container image for vulnerabilities with Trivy (SARIF) and optionally uploads the result to the
  Security tab (code scanning – public repositories, or private ones with GitHub Advanced Security).
  The calling job needs `security-events: write` for the upload.
inputs:
  image:
    description: Image reference (local Docker image or registry reference)
    required: true
  severity:
    description: Severities to report
    default: CRITICAL,HIGH
  ignore-unfixed:
    description: Skip vulnerabilities without a fixed version
    default: 'true'
  exit-code:
    description: Exit code when vulnerabilities are found ('0' = report only)
    default: '0'
  upload-sarif:
    description: Upload the SARIF file to code scanning
    default: 'true'
  category:
    description: Code scanning category
    default: trivy
  output:
    description: Path of the SARIF file
    default: trivy.sarif
  trivy-version:
    description: Trivy version
    default: v0.76.2
outputs:
  file:
    description: Path of the SARIF file
    value: ${{ inputs.output }}
runs:
  using: composite
  steps:
    - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
      with:
        version: ${{ inputs.trivy-version }}
        cache: true

    - name: Scan image
      shell: bash
      env:
        IMAGE: ${{ inputs.image }}
        SEVERITY: ${{ inputs.severity }}
        IGNORE_UNFIXED: ${{ inputs.ignore-unfixed }}
        EXIT_CODE: ${{ inputs.exit-code }}
        OUTPUT: ${{ inputs.output }}
      run: |
        args=(image --quiet --scanners vuln --severity "${SEVERITY}" --exit-code "${EXIT_CODE}")
        if [ "${IGNORE_UNFIXED}" = "true" ]; then
          args+=(--ignore-unfixed)
        fi
        # table for the job log (never fails), SARIF for the Security tab (exit code decides)
        trivy "${args[@]}" --exit-code 0 --format table "${IMAGE}"
        trivy "${args[@]}" --skip-db-update --format sarif --output "${OUTPUT}" "${IMAGE}"

    - name: Upload SARIF
      if: ${{ always() && inputs.upload-sarif == 'true' && hashFiles(inputs.output) != '' }}
      uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
      with:
        sarif_file: ${{ inputs.output }}
        category: ${{ inputs.category }}
