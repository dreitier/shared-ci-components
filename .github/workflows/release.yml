name: Release

# On every push to main: CI, then semantic-release (tag vX.Y.Z, CHANGELOG.md, GitHub release) with the
# GitHub App dreitier-release-bot – through this repository's own semantic-release action. Callers pin the actions by commit SHA with the tag as comment
# (`uses: dreitier/shared-ci-components/sbom@<sha> # v1.2.3`); Dependabot/Renovate update them.
on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  # dogfooding: the repository releases itself with its own semantic-release action (local path, so a broken
  # change of the action fails here before callers get it)
  semantic-release:
    name: Version & GitHub release
    needs: ci
    runs-on: ubuntu-latest
    # all writes use the GitHub App token, which may bypass the ruleset of main
    permissions:
      contents: read
    steps:
      # a local action needs the repository on disk; the action checks out again with full history
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./semantic-release
        with:
          app-client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          tag-format: 'v${version}'
          # exactly the existing header of CHANGELOG.md – a different title would be added on top of the old one
          changelog-title: "# Changelog\n\nAll notable changes to this project are documented in this file. It is generated by [semantic-release](https://github.com/semantic-release/semantic-release) from [Conventional Commits](https://www.conventionalcommits.org/) and follows [Semantic Versioning](https://semver.org/spec/v2.0.0.html)."
