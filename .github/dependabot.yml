# Dependency updates. "daily" runs Monday to Friday.
# Commit prefixes decide whether semantic-release publishes a new version when the PR is merged:
#   build(deps): ...  -> patch release (actions used INSIDE the composite actions – callers get them)
#   ci(deps): ...     -> no release (this repository's own workflows and release tooling)
version: 2

updates:
  # actions used by the composite actions themselves
  - package-ecosystem: github-actions
    directories:
      - /sbom
      - /trivy-scan
      - /dependency-track-upload
      - /cosign-sign
      - /semantic-release
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: build
      include: scope
    groups:
      composite-actions:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  # semantic-release and plugins installed by the semantic-release action → callers get them (patch release)
  - package-ecosystem: npm
    directory: /semantic-release
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: build
      include: scope
    groups:
      semantic-release:
        patterns:
          - "*"
    ignore:
      # 10.x needs a newer conventional-changelog-writer than semantic-release 25 bundles
      - dependency-name: conventional-changelog-conventionalcommits
        update-types:
          - version-update:semver-major
      # 26.x needs Node >= 26.13 (the action sets up 24) and pulls beta packages (@semantic-release/core
      # 1.0.0-beta, commit-analyzer 14 / release-notes-generator 15 beta) – by hand once they are stable,
      # together with node-version '26' in semantic-release/action.yml
      - dependency-name: semantic-release
        update-types:
          - version-update:semver-major

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
      include: scope
    groups:
      pre-commit:
        patterns:
          - "*"

  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: daily
      time: "06:00"
      timezone: Europe/Berlin
    commit-message:
      prefix: ci
      include: scope

  # base image of the CI test image
  - package-ecosystem: docker
    directory: /.github/test
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
      include: scope
